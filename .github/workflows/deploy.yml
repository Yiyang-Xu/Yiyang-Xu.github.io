name: Deploy Quartz Wiki to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout Quartz v4
        run: git clone --depth 1 --branch v4 https://github.com/jackyzha0/quartz.git quartz-src

      - name: Overlay French wiki content and configuration
        run: |
          rm -rf quartz-src/content
          cp -R quartz-content quartz-src/content
          cp quartz-site/quartz.config.ts quartz-src/quartz.config.ts
          cp quartz-site/quartz.layout.ts quartz-src/quartz.layout.ts
          cp quartz-site/custom.scss quartz-src/quartz/styles/custom.scss

      - name: Install Quartz dependencies
        working-directory: quartz-src
        run: npm ci

      - name: Build Quartz site
        working-directory: quartz-src
        run: npx quartz build

      - name: Inline Quartz stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          public = Path('quartz-src/public')
          css = (public / 'index.css').read_text(encoding='utf-8')
          style = '<style data-quartz-inline="true">' + css + '</style>'

          for html_path in public.rglob('*.html'):
              text = html_path.read_text(encoding='utf-8')
              text, count = re.subn(
                  r'<link\s+href="(?:\.\./)*index\.css"\s+rel="stylesheet"\s+type="text/css"\s+data-persist="true"\s*/?>',
                  style,
                  text,
                  count=1,
              )
              if count == 0:
                  text = text.replace('</head>', style + '</head>', 1)
              html_path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-src/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
